name: "doc-sentinel"
description: >-
  Self-healing technical documentation: detects doc sections made stale by a
  pull request's code changes, auto-fixes high-confidence drift via a docs PR,
  and flags the rest for human review.
author: "abetep"
branding:
  icon: "book-open"
  color: "blue"

inputs:
  github-token:
    description: "Token used to comment on the PR and open the docs fix PR"
    required: true
    default: ${{ github.token }}
  openai-api-key:
    description: "OpenAI API key (embeddings and LLM against api.openai.com)"
    required: false
  llm-provider:
    description: "openai | none (none = detect and flag only, no LLM)"
    required: false
    default: "openai"
  llm-base-url:
    description: "Alternate OpenAI-compatible endpoint (Azure, Ollama, vLLM, OpenRouter, ...)"
    required: false
  llm-model:
    description: "Model name for the LLM endpoint (default gpt-4o)"
    required: false
  llm-api-key:
    description: "API key for the alternate endpoint (falls back to openai-api-key)"
    required: false
  embeddings:
    description: "openai | none (none = lexical links only)"
    required: false
    default: "openai"
  confidence-threshold:
    description: "Minimum confidence (0-1) for auto-fixing instead of drafting/flagging"
    required: false
    default: "0.8"
  mode:
    description: "fix (open a docs PR for corrections) | flag-only (comment only)"
    required: false
    default: "fix"

outputs:
  stale-count:
    description: "Number of doc sections confirmed stale"
  fixed-count:
    description: "Number of sections auto-fixed or drafted in the docs PR"
  flagged-count:
    description: "Number of sections flagged for human review"
  fix-pr-url:
    description: "URL of the docs fix PR, when one was opened"

runs:
  using: "docker"
  image: "Dockerfile"
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    OPENAI_API_KEY: ${{ inputs.openai-api-key }}
    DOC_SENTINEL_LLM_BASE_URL: ${{ inputs.llm-base-url }}
    DOC_SENTINEL_LLM_MODEL: ${{ inputs.llm-model }}
    DOC_SENTINEL_LLM_API_KEY: ${{ inputs.llm-api-key }}
  args:
    - "run"
    - "--llm"
    - ${{ inputs.llm-provider }}
    - "--embeddings"
    - ${{ inputs.embeddings }}
    - "--confidence-threshold"
    - ${{ inputs.confidence-threshold }}
    - "--mode"
    - ${{ inputs.mode }}
