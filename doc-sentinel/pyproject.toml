[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-sentinel"
version = "0.1.0"
description = "GitHub Action that detects and repairs stale documentation when code changes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "abetep" }]
dependencies = [
    "pydantic>=2.5",
    "markdown-it-py>=3.0",
    "GitPython>=3.1",
    "PyGithub>=2.1",
]

[project.optional-dependencies]
runtime = ["chromadb>=0.4", "openai>=1.10", "anthropic>=0.34"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
doc-sentinel = "doc_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
strict = true
ignore_missing_imports = true
